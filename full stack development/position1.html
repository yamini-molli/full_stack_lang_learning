<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color: aqua;
            height: 100px;
            width: 100px;
            position: fixed;
            right: 0px;
            bottom: 0px;
            

        }
        .box2{
            background-color: blueviolet;
            
            height: 100px;
            width: 100px;
            position: fixed;
            top:0px;
            right: 0px;
        }
        .box3{
            background-color: blue;
            height: 100px;
            width: 100px;
            position: fixed;
            left:0px;
            bottom: 0px;
        }
        .box4{
            background-color: brown;
            height: 100px;
            width: 100px;
            position: fixed;
            left:0px;
            top:0px;
        }
    </style>
</head>
<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <div class="box4">box4</div>
    
    
</body>
</html>
